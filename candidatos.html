<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidatos | Plataforma de Recrutamento</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand">Plataforma de Recrutamento</div>
        <nav class="main-nav" aria-label="Menu principal">
          <a href="index.html">Início</a>
          <a href="vagas.html">Vagas</a>
          <a href="empresas.html">Empresas</a>
          <a href="candidatos.html">Candidatos</a>
          <span id="authLinks" class="auth-links"></span>
        </nav>
      </div>
    </header>

    <main class="container page-content">
      <div class="section-header">
        <div>
          <span class="eyebrow">Perfil</span>
          <h1>Área do candidato</h1>
        </div>
      </div>

      <div id="authNotice" class="card" style="margin-bottom:16px;display:none"></div>

      <section class="candidate-panel" id="candidatePanel">
        <form id="candidateForm" class="candidate-form">
          <label>
            Nome completo
            <input type="text" id="name" required />
          </label>
          <label>
            E-mail
            <input type="email" id="email" required />
          </label>
          <label>
            Resumo profissional
            <textarea id="bio" rows="4" placeholder="Descreva sua experiência"></textarea>
          </label>
          <button class="btn btn-primary" type="submit">Salvar perfil</button>
        </form>

        <aside class="applications-box">
          <h2>Minhas candidaturas</h2>
          <div id="applicationsList" class="applications-list"></div>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">© <span id="year"></span> Plataforma de Recrutamento</div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
